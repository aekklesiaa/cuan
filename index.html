<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2747D6">
<title>Cuan!</title>
<meta name="description" content="Catatan keuangan konyol tapi rapi bareng Si Cuan">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuan!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ================= Cuan! · gaya visual ================= */
:root{
  --cobalt:#2747D6; --cobalt-dark:#1D36A8; --ink:#1B2559; --yellow:#FFD23F; --red:#E5383B;
  --cream:#FFFDF7; --muted:#5B6485; --line:#E3E7F2; --green:#2BB673;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior:none;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
html,body{max-width:100vw}
input,textarea,select{-webkit-user-select:text;user-select:text}
body{min-height:100vh;min-height:100dvh}
button,input,select{font-family:inherit;color:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:calc(14px + var(--safe-t)) 20px calc(130px + var(--safe-b));display:flex;flex-direction:column;gap:16px}
.chewy{font-family:'Chewy',system-ui,sans-serif;font-weight:400;letter-spacing:.3px}
.h1{font-family:'Chewy',system-ui,sans-serif;font-size:36px;line-height:1.1;color:var(--cobalt);margin:0}
.h2{font-family:'Chewy',system-ui,sans-serif;font-size:22px;color:var(--cobalt);margin:0}
.sub{font-size:13px;font-weight:700;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;touch-action:pan-x pan-y;overscroll-behavior-x:contain}.hscroll::-webkit-scrollbar{display:none}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet-anim{animation:up .34s cubic-bezier(.2,.9,.25,1.15)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.backdrop-anim{animation:bd .2s ease}
@keyframes bd{from{opacity:0}to{opacity:1}}
.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-2deg)}to{opacity:1;transform:none}}
.toast-anim{animation:drop .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes drop{from{opacity:0;transform:translateY(-24px) rotate(-2deg)}to{opacity:1;transform:none}}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wig{animation:wig .6s ease}
@keyframes wig{0%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.08)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.press{transition:transform .12s ease,box-shadow .12s ease}.press:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)!important}
.card{background:#fff;border:2px solid var(--ink);border-radius:22px;padding:16px;box-shadow:0 3px 0 var(--ink)}
.segwrap{display:flex;gap:4px;padding:3px;border:2px solid var(--cobalt);border-radius:999px;background:#fff}
.seg{flex:1;height:38px;border:0;border-radius:999px;background:transparent;color:var(--cobalt);font-size:13px;font-weight:800;cursor:pointer;transition:all .2s ease;white-space:nowrap;padding:0 6px}
.seg.on{background:var(--cobalt);color:#fff}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--yellow)}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:18px;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:11px;font-weight:800;color:var(--ink);transition:all .15s ease;min-height:86px}
.cat.on{border-color:var(--ink);background:#FFF4C2;box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.badge-ini{display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);font-family:'Chewy',system-ui,sans-serif;flex:none}
.pos{color:#1E7F4F}.neg{color:#C62828}.neu{color:var(--ink)}.muted{color:var(--muted)}.warnt{color:#8A5A00}
.track{height:12px;background:#EEF1F8;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px;transition:width .7s cubic-bezier(.2,.9,.3,1.2)}
.fill.ok{background:var(--cobalt)}.fill.warn{background:#FFB703}.fill.over{background:var(--red)}.fill.good{background:var(--green)}.fill.inc{background:var(--green)}.fill.out{background:var(--cobalt)}.fill.none{background:transparent}
.bar{width:100%;border-radius:7px 7px 3px 3px}
.bar.today{background:var(--yellow);border:2px solid var(--ink)}.bar.day{background:var(--cobalt)}.bar.zero{background:var(--line)}
.btn{height:54px;width:100%;border:2px solid var(--ink);border-radius:18px;background:var(--cobalt);color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{cursor:progress;background:var(--cobalt-dark)}
.btn.sm{height:46px;font-size:14px;border-radius:16px;box-shadow:0 3px 0 var(--ink)}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.danger{background:#FDE7E7;color:#B3261E;border-color:#B3261E;box-shadow:0 3px 0 #B3261E}
.btn.red{background:#C62828;color:#fff}
.btn-soft{height:40px;padding:0 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.dashed{height:52px;width:100%;border:2px dashed var(--cobalt);border-radius:18px;background:#F3F6FF;color:var(--cobalt-dark);font-weight:900;font-size:14px;cursor:pointer}
.link{border:0;background:none;color:var(--cobalt);font-weight:900;font-size:13px;cursor:pointer;padding:0 4px;min-height:44px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.field{width:100%;height:48px;border:2px solid var(--ink);border-radius:14px;padding:0 14px;font-size:16px;font-weight:600;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.lbl{font-size:12px;font-weight:900;color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
.money{display:flex;align-items:center;gap:8px;padding:2px 16px;border-radius:18px;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.money input{flex:1;min-width:0;border:0;background:transparent;font-size:34px;font-weight:900;color:var(--ink);height:58px;padding:0;outline:none}
.money input:focus{outline:none}.money:focus-within{box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--yellow)}
.bubble{position:relative;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 var(--ink);font-size:13px;font-weight:700;line-height:1.4}
.bubble::before{content:'';position:absolute;left:-9px;top:22px;width:14px;height:14px;background:#fff;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.txbtn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 var(--ink);text-align:left;cursor:pointer;color:var(--ink)}
.bluecard{position:relative;border:2px solid var(--ink);border-radius:26px;padding:18px;background:var(--cobalt);color:#fff;box-shadow:0 4px 0 var(--ink)}
.whitecell{padding:10px 12px;border-radius:16px;background:#fff;color:var(--ink);border:2px solid var(--ink)}
.caps{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.sticker{padding:5px 10px;border:2px solid var(--ink);border-radius:999px;font-size:12px;font-weight:900;color:var(--ink);white-space:nowrap}
.errbox{display:flex;gap:10px;align-items:center;padding:8px 12px;border:2px solid #C62828;border-radius:16px;background:#FDE7E7;color:#B3261E;font-size:13px;font-weight:900}
.check{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--ink);border-radius:16px;background:#fff;font-size:14px;font-weight:800;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--cobalt);flex:none}
/* lapisan tetap */
#nav{position:fixed;left:14px;right:14px;bottom:calc(16px + var(--safe-b));max-width:452px;margin:0 auto;z-index:30;height:68px;padding:0 6px;background:var(--cobalt);border:2px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:#C9D4FF;font-size:11px;font-weight:800;cursor:pointer;min-height:56px}
.nav.on{color:var(--yellow)}
.fab{width:64px;height:64px;margin:-30px auto 0;border:2.5px solid var(--ink);border-radius:50%;background:var(--yellow);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.backdrop{position:fixed;inset:0;z-index:35;border:0;background:rgba(27,37,89,.45);cursor:default;width:100%}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;z-index:40;background:var(--cream);border:2px solid var(--ink);border-bottom:0;border-radius:30px 30px 0 0;padding:10px 20px calc(24px + var(--safe-b));max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px}
.handle{width:44px;height:6px;border-radius:999px;background:var(--ink);align-self:center;flex:none}
.trashbtn{margin-left:10px;width:36px;height:36px;flex:none;border:2px solid var(--ink);border-radius:12px;background:#fff;color:#B3261E;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 0 var(--ink)}.trashbtn:active{transform:translateY(2px);box-shadow:none}
.xbtn{width:44px;height:44px;flex:none;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.confirm{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(27,37,89,.55)}
.toast{position:fixed;top:calc(14px + var(--safe-t));left:14px;right:14px;max-width:452px;margin:0 auto;z-index:60;color:#fff;background:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 #0E1430}
.toast.err{background:#C62828}
.conf-layer{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.conf{position:absolute;top:-24px;height:16px;border:2px solid var(--ink);border-radius:3px;animation:fall 2.4s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.skeleton{background:linear-gradient(90deg,#EEF1F8 25%,#F7F8FC 50%,#EEF1F8 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px}
@keyframes sk{to{background-position:-200% 0}}
.calc-display{display:flex;align-items:center;gap:8px;padding:6px 16px;min-height:62px;border-radius:18px;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.calc-expr{flex:1;min-width:0;text-align:right;font-size:34px;font-weight:900;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:clip;}
.calc-expr.long{font-size:24px}.calc-expr .op{color:var(--cobalt);padding:0 4px}.calc-expr .ph{color:#B7BDD3}
.calc-prev{text-align:right;font-size:14px;font-weight:900;color:var(--cobalt);min-height:18px;margin-top:-4px}
.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ck{height:50px;border:2px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Nunito',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.ck:active{transform:translateY(2px);box-shadow:none}
.ck.op{background:#E6ECFF;color:var(--cobalt-dark);font-size:26px}.ck.eq{background:var(--cobalt);color:#fff;font-size:26px}.ck.del{background:#FFF4D6}.ck.clr{background:#F3F6FF;font-size:16px}
.sheet-foot{position:sticky;bottom:calc(-24px - var(--safe-b));margin:0 -20px calc(-24px - var(--safe-b));padding:12px 20px calc(18px + var(--safe-b));background:linear-gradient(rgba(255,253,247,0),var(--cream) 22%);display:flex;flex-direction:column;gap:6px;z-index:2}
.pinwrap{max-width:420px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.pindots{display:flex;gap:12px;justify-content:center;min-height:24px}
.pindot{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;transition:background .15s}
.pindot.on{background:var(--yellow)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:300px}
.key{height:64px;border:2px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--ink);font-family:'Nunito',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.key.ok{background:var(--cobalt);color:#fff}.key.soft{background:#F3F6FF;font-size:15px}
.key[disabled]{opacity:.6}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.lockbtn{width:40px;height:40px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="main"></main>
<nav id="nav" aria-label="Navigasi utama"></nav>
<div id="layer-sheet"></div>
<div id="layer-confirm"></div>
<div id="layer-confetti"></div>
<div id="layer-toast" aria-live="polite"></div>

<script>
/* =====================================================================
 * Cuan! · frontend
 * Tampilan ini di-host di GitHub Pages. Data diambil dan disimpan lewat
 * API Google Apps Script (Code.gs), dikunci dengan PIN.
 * ===================================================================== */

/* ---------- Gaya per kategori ---------- */
var CAT_STYLE = {
  'Makan & Minum': { c: '#2747D6', d: '#1D36A8', t: '#E6ECFF', i: 'MM' },
  'Transportasi': { c: '#4CC9F0', d: '#0B6E8A', t: '#E3F7FD', i: 'TR' },
  'Belanja': { c: '#FF7AA2', d: '#B0244F', t: '#FFE8EF', i: 'BL' },
  'Tagihan': { c: '#FFB703', d: '#8A5A00', t: '#FFF4D6', i: 'TG' },
  'Hiburan': { c: '#E5383B', d: '#B3261E', t: '#FDE7E7', i: 'HB' },
  'Kesehatan': { c: '#2BB673', d: '#1E7F4F', t: '#E3F6EC', i: 'KS' },
  'Lainnya': { c: '#9AA3B5', d: '#475069', t: '#EEF0F4', i: 'LN' },
  'Gaji': { c: '#2BB673', d: '#1E7F4F', t: '#E3F6EC', i: 'GJ' },
  'Bayar Hutang': { c: '#7C3AED', d: '#5B21B6', t: '#EFE7FF', i: 'BH' },
  'Setor Tabungan': { c: '#14B8A6', d: '#0F766E', t: '#E2F7F4', i: 'ST' },
  'Setor Investasi': { c: '#0EA5E9', d: '#0369A1', t: '#E0F2FE', i: 'SI' }
};
var CAT_ICON = {
  'Makan & Minum': 'food', 'Transportasi': 'car', 'Belanja': 'bag', 'Tagihan': 'bill', 'Hiburan': 'game', 'Kesehatan': 'health',
  'Lainnya': 'dots', 'Gaji': 'cash', 'Bayar Hutang': 'payhand', 'Setor Tabungan': 'piggy', 'Setor Investasi': 'trend'
};
var EXTRA_STYLES = [
  { c: '#F97316', d: '#9A3412', t: '#FFEDD5' }, { c: '#A855F7', d: '#7E22CE', t: '#F3E8FF' },
  { c: '#84CC16', d: '#3F6212', t: '#ECFCCB' }, { c: '#06B6D4', d: '#0E7490', t: '#CFFAFE' },
  { c: '#F43F5E', d: '#9F1239', t: '#FFE4E6' }, { c: '#64748B', d: '#334155', t: '#F1F5F9' }
];
var KIND_STYLE = {
  'Reksa dana': { d: '#1D36A8', t: '#E6ECFF', i: 'RD', ic: 'pie' }, 'Saham': { d: '#B0244F', t: '#FFE8EF', i: 'SH', ic: 'candle' },
  'Deposito': { d: '#0B6E8A', t: '#E3F7FD', i: 'DP', ic: 'bank' }, 'Emas': { d: '#8A5A00', t: '#FFF4D6', i: 'EM', ic: 'gold' },
  'Rekening': { d: '#1E7F4F', t: '#E3F6EC', i: 'RK', ic: 'card' }, 'Crypto': { d: '#7E22CE', t: '#F3E8FF', i: 'CR', ic: 'coin' },
  'Obligasi': { d: '#9A3412', t: '#FFEDD5', i: 'OB', ic: 'doc' }, 'Lainnya': { d: '#475069', t: '#EEF0F4', i: 'LN', ic: 'tag' }
};
var INV_KINDS = ['Reksa dana', 'Saham', 'Deposito', 'Emas', 'Rekening', 'Crypto', 'Obligasi', 'Lainnya'];
var DEBT_KINDS = ['Pribadi', 'Kartu kredit', 'Paylater', 'Cicilan', 'Lainnya'];

function catStyle(name) {
  if (CAT_STYLE[name]) return Object.assign({ ic: CAT_ICON[name] || 'tag' }, CAT_STYLE[name]);
  var h = 0; for (var k = 0; k < name.length; k++) h = (h * 31 + name.charCodeAt(k)) >>> 0;
  var s = EXTRA_STYLES[h % EXTRA_STYLES.length];
  var words = name.trim().split(/\s+/);
  var ini = (words.length > 1 ? words[0][0] + words[1][0] : name.slice(0, 2)).toUpperCase();
  return { c: s.c, d: s.d, t: s.t, i: ini, ic: 'tag' };
}
function kindStyle(k) { return KIND_STYLE[k] || { d: '#475069', t: '#EEF0F4', i: (k || 'LN').slice(0, 2).toUpperCase(), ic: 'tag' }; }

/* ---------- Kalimat Si Cuan ---------- */
var ROAST = {
  'Makan & Minum': 'Makan lagi? Cuan juga laper sih.',
  'Transportasi': 'Brum brum! Ongkos jalan aman tercatat.',
  'Belanja': 'Checkout lagi ya… Cuan pura-pura nggak lihat.',
  'Tagihan': 'Bayar tagihan tepat waktu. Dewasa banget kamu.',
  'Hiburan': 'Healing itu perlu. Asal jangan tiap hari ya.',
  'Kesehatan': 'Sehat itu investasi. Cuan setuju 100%.',
  'Lainnya': 'Misterius… tapi tetap Cuan catat.',
  'Gaji': 'GAJIAN!! Cuan joget-joget di dompet.'
};
var LINES = {
  happy: ['Halo bos! Hari ini mau hemat atau khilaf?', 'Cuan siap nyatet. Jangan ngumpet-ngumpet jajannya ya.', 'Uang nggak tumbuh di pohon. Kecuali di kepala Cuan.', 'Habis jajan? Langsung catat, jangan nunggu lupa.'],

function thousands(n) { return Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function rp(n) { return (n < 0 ? '−' : '') + 'Rp ' + thousands(n); }

  if (a >= 1e6) return 'Rp ' + (a / 1e6).toFixed(1).replace('.', ',').replace(/,0$/, '') + ' jt';

function dt(s) { return new Date(s + 'T00:00:00Z'); }

function diffDays(a, b) { return Math.round((dt(b) - dt(a)) / 864e5); }

function dLong(s) { var d = dt(s); return HARI[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + BULAN[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }

function dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

}

  S.sync = 'loading'; renderMain(false);
  return server('getAll').then(function (d) { setData(d); renderAll(); })
    .catch(function (e) { if (!S.token) return; S.sync = 'error'; renderAll(); if (!silent) toast('Gagal memuat data', errMsg(e), 'cry', true); });
}
function clearLocal() { try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(CACHE_KEY); } catch (e) { } }
function lockApp(msg) {
  S.token = ''; S.data = null; S.sheet = null; S.confirm = false; clearLocal();
  S.pin = { mode: 'login', value: '', first: '', err: msg || '', busy: false, shake: 0, len: Number(store('cuan-pin-len')) || 0 };
  renderAll();
}
function checkPin() {
  S.pin.mode = 'checking'; renderMain(false);
  api({ fn: 'pinStatus' }).then(function (d) { S.pin.mode = d.hasPin ? 'login' : 'create'; S.pin.err = ''; if (d.len) { S.pin.len = d.len; store('cuan-pin-len', String(d.len)); } renderMain(false); })
    .catch(function (e) { S.pin.mode = 'offline'; S.pin.err = errMsg(e); renderMain(false); });
}

/* ---------- Layar PIN ---------- */
function screenPin() {
  var P = S.pin, title, sub, mood = 'happy';
  if (P.mode === 'checking') { title = 'Sebentar…'; sub = 'Cuan lagi ngecek kunci rumah.'; mood = 'sleepy'; }
  else if (P.mode === 'offline') { title = 'Nggak nyambung'; sub = 'Cuan nggak bisa ngobrol sama server. Cek internet lalu coba lagi.'; mood = 'cry'; }
  else if (P.mode === 'create') { title = 'Bikin PIN dulu'; sub = 'PIN 6 angka ini yang ngunci catatan keuanganmu. Jangan kasih tahu siapa-siapa, termasuk Cuan.'; }
  else if (P.mode === 'confirm') { title = 'Ulangi PIN-nya'; sub = 'Biar Cuan yakin kamu nggak salah ketik.'; }
  else { title = 'Masukin PIN'; sub = 'Cuan jagain dompetmu. Siapa kamu?'; mood = 'proud'; }
  if (P.err && P.mode !== 'offline') mood = 'shock';
  var h = '<div class="pinwrap">' + cuan(mood, 120) +
    '<div><div class="chewy" style="font-size:34px;color:var(--cobalt);line-height:1.1">' + title + '</div><div class="sub" style="margin-top:6px">' + sub + '</div></div>';
  if (P.mode === 'checking') return h + '<div class="skeleton" style="width:200px;height:20px"></div></div>';
  if (P.mode === 'offline') return h + '<div class="sub" style="font-size:12px">' + esc(P.err) + '</div><button class="btn" style="max-width:300px" data-act="pinRetry">Coba lagi</button></div>';
  var need = pinNeed(), nd = need || 6, dots = '';
  for (var i = 0; i < nd; i++) dots += '<span class="pindot' + (i < P.value.length ? ' on' : '') + '"></span>';
  h += '<div class="pindots' + (P.shake ? ' shake' : '') + '" aria-label="' + P.value.length + ' angka dimasukkan">' + dots + '</div>';
  h += '<div role="alert" style="min-height:20px;font-size:13px;font-weight:900;color:#B3261E">' + (P.busy ? '<span style="color:var(--cobalt)">Ngecek PIN…</span>' : esc(P.err)) + '</div>';
  var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', need ? '' : 'ok', '0', 'del'];
  h += '<div class="keypad">' + keys.map(function (k) {
    if (k === '') return '<span></span>';
    if (k === 'del') return '<button class="key soft" data-act="pinKey" data-v="del" aria-label="Hapus"' + (P.busy ? ' disabled' : '') + '>' + icon('backspace', 26, 2.2) + '</button>';
    if (k === 'ok') return '<button class="key ok" data-act="pinKey" data-v="ok" aria-label="OK"' + (P.busy ? ' disabled' : '') + '>OK</button>';
    return '<button class="key" data-act="pinKey" data-v="' + k + '"' + (P.busy ? ' disabled' : '') + '>' + k + '</button>';
  }).join('') + '</div>';
  if (P.mode === 'login' && !need) h += '<div class="sub" style="font-size:12px;max-width:300px">Tekan OK sekali ini aja. Habis itu Cuan hafal, PIN langsung masuk.</div>';
  if (P.mode === 'login') h += '<div class="sub" style="font-size:12px;max-width:300px">Lupa PIN? Jalankan fungsi <b>resetPin</b> di editor Apps Script, lalu buat PIN baru di sini.</div>';
  return h + '</div>';
}
function pinNeed() { var P = S.pin; return P.mode === 'login' ? (P.len || 0) : NEW_PIN_LEN; }
function pinKey(k) {
  var P = S.pin; if (P.busy || ['login', 'create', 'confirm'].indexOf(P.mode) < 0) return;
  P.shake = 0;
  if (k === 'del') { P.value = P.value.slice(0, -1); P.err = ''; renderMain(false); return; }
  var need = pinNeed();
  if (k !== 'ok') {
    if (P.value.length >= (need || 6)) return;
    P.value += k; P.err = '';
    if (need && P.value.length === need) { renderMain(false); setTimeout(function () { pinSubmit(); }, 120); return; }
    renderMain(false); return;
  }
  pinSubmit();
}
function pinSubmit() {
  var P = S.pin;
  if (P.value.length < 4) { P.err = 'PIN minimal 4 angka.'; P.shake = 1; renderMain(false); return; }
  if (P.mode === 'create') { P.first = P.value; P.value = ''; P.mode = 'confirm'; renderMain(false); return; }
  if (P.mode === 'confirm' && P.value !== P.first) { P.mode = 'create'; P.first = ''; P.value = ''; P.err = 'PIN-nya beda. Ulangi dari awal ya.'; P.shake = 1; renderMain(false); return; }
  var created = P.mode === 'confirm', len = P.value.length;
  P.busy = true; renderMain(false);
  api(created ? { fn: 'createPin', pin: P.value } : { fn: 'login', pin: P.value }).then(function (d) {
    S.token = d.token; store(TOKEN_KEY, d.token); store('cuan-pin-len', String(len));
    S.pin = { mode: 'login', value: '', first: '', err: '', busy: false, shake: 0, len: len };
    renderAll(); load(false);
    toast(created ? 'PIN berhasil dibuat!' : 'Selamat datang lagi!', created ? 'Cuan sekarang jaga pintu dompetmu.' : 'Cuan kangen. Yuk nyatet.', 'proud');
  }).catch(function (e) {
    P.busy = false; P.value = ''; P.err = errMsg(e); P.shake = 1;
    if (e.code === 'NO_PIN') { P.mode = 'create'; P.err = ''; }
    renderMain(false);
  });
}

/* ---------- Perhitungan tampilan ---------- */
function compute() {
  var D = S.data, T = todayISO();
  var txs = D.transactions.filter(function (t) { return t.date; }).slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  var inR = function (t, f, to) { return t.date >= f && t.date <= to; };
  var sumT = function (arr, type) { return arr.reduce(function (a, t) { return t.type === type ? a + t.amount : a; }, 0); };
  var r = getRange(S.period, T, S.cFrom, S.cTo);
  var cur = txs.filter(function (t) { return inR(t, r.from, r.to); });
  var prev = txs.filter(function (t) { return inR(t, r.pf, r.pt); });
  var inc = sumT(cur, 'in'), exp = sumT(cur, 'out'), pexp = sumT(prev, 'out');
  var byCat = {};
  cur.forEach(function (t) { if (t.type === 'out') byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
  var catList = Object.keys(byCat).map(function (k) { return { name: k, amt: byCat[k] }; }).sort(function (a, b) { return b.amt - a.amt; });
  var acc = 0, stops = [], maxCat = catList.length ? catList[0].amt : 1;
  var catRows = catList.map(function (c) {
    var pct = exp ? c.amt / exp * 100 : 0, s = catStyle(c.name);
    stops.push(s.c + ' ' + acc.toFixed(2) + '% ' + (acc + pct).toFixed(2) + '%'); acc += pct;
    return { name: c.name, color: s.c, amt: rp(c.amt), pct: Math.round(pct), w: Math.max(2, c.amt / maxCat * 100).toFixed(1) };
  });
  var endAvg = r.to < T ? r.to : T, daysCount = Math.max(1, diffDays(r.from, endAvg) + 1);
  var ch = 0, cmpText = 'Belum ada data pembanding', cmpCls = 'muted';
  if (pexp > 0) {
    ch = (exp - pexp) / pexp * 100;
    if (ch <= 0) { cmpText = Math.abs(Math.round(ch)) + '% lebih hemat'; cmpCls = 'pos'; } else { cmpText = Math.round(ch) + '% lebih boros'; cmpCls = 'neg'; }
  }
  var gelar = pexp === 0 ? 'Anak Baru' : ch <= -15 ? 'Pendekar Hemat' : ch <= 0 ? 'Calon Sultan' : ch <= 20 ? 'Agak Khilaf' : 'Sultan Dadakan';

  var tr = [], mx = 0;
  for (var i = 13; i >= 0; i--) {
    var d = addDays(T, -i), v = 0;
    txs.forEach(function (t) { if (t.type === 'out' && t.date === d) v += t.amount; });
    tr.push({ d: d, v: v }); if (v > mx) mx = v;
  }
  var peak = tr.reduce(function (a, b) { return b.v > a.v ? b : a; }, tr[0]);
  var pm = prevMonth(T);
  var mdefs = [{ from: pm.from, to: pm.end, label: BULAN[pm.m - 1] + ' ' + pm.y }, { from: monthStart(T), to: T, label: BULAN[+T.slice(5, 7) - 1] + ' (s.d. ' + dShort(T) + ')' }];
  var mvals = mdefs.map(function (m) { var a = txs.filter(function (t) { return inR(t, m.from, m.to); }); return { label: m.label, i: sumT(a, 'in'), o: sumT(a, 'out') }; });
  var mmax = Math.max.apply(null, [1].concat(mvals.map(function (m) { return Math.max(m.i, m.o); })));

  var hasDay = {}; D.transactions.forEach(function (t) { hasDay[t.date] = true; });
  var stamps = []; for (var j = 6; j >= 0; j--) { var sd = addDays(T, -j); stamps.push({ done: !!hasDay[sd], label: sd === T ? 'Hari ini' : String(+sd.slice(8)) }); }
  var stampCount = stamps.filter(function (s) { return s.done; }).length, streak = 0;
  while (hasDay[addDays(T, -streak)]) streak++;

  // Budget bulan ini
  var mFrom = monthStart(T), mSpent = {};
  txs.forEach(function (t) { if (t.type === 'out' && inR(t, mFrom, T)) mSpent[t.category] = (mSpent[t.category] || 0) + t.amount; });
  var outCats = D.categories.out.slice();
  Object.keys(D.budgets).forEach(function (c) { if (outCats.indexOf(c) < 0) outCats.push(c); });
  var budTotal = 0, budSpent = 0, overList = [];
  outCats.forEach(function (c) { var b = D.budgets[c] || 0; if (b > 0) { budTotal += b; budSpent += mSpent[c] || 0; if ((mSpent[c] || 0) > b) overList.push(c); } });
  var y0 = +T.slice(0, 4), m0 = +T.slice(5, 7), d0 = +T.slice(8, 10), daysLeft = dim(y0, m0) - d0 + 1;

  var tobat = store('cuan-tobat-' + T.slice(0, 7)) === '1';
  var mood = 'happy';
  if (exp === 0 && inc === 0) mood = 'sleepy';
  else if (inc - exp < 0 && inc > 0) mood = 'cry';
  else if (overList.length && !tobat) mood = 'panic';
  else if (pexp > 0 && ch <= 0) mood = 'proud';
  var lines = LINES[mood];

  var invTotal = 0, invModal = 0; D.invs.forEach(function (x) { invTotal += x.nilai; invModal += x.modal; });
  var debtLeft = 0, debtActive = 0; D.debts.forEach(function (x) { var l = x.total - x.paid; debtLeft += l; if (l > 0) debtActive++; });
  var goalSaved = 0, goalTarget = 0; D.goals.forEach(function (g) { goalSaved += g.saved; goalTarget += g.target; });

  return {
    T: T, txs: txs, r: r, inc: inc, exp: exp, pexp: pexp, catRows: catRows, donut: stops.join(', ') || '#E3E7F2 0% 100%',
    top: catList[0] ? { name: catList[0].name, amt: rp(catList[0].amt), pct: Math.round(catList[0].amt / exp * 100), s: catStyle(catList[0].name) } : null,
    daysCount: daysCount, avg: exp / daysCount, cmpText: cmpText, cmpCls: cmpCls, gelar: gelar,
    trend: tr, mx: mx, peak: peak, months: mvals, mmax: mmax,
    stamps: stamps, stampCount: stampCount, streak: streak,
    mSpent: mSpent, outCats: outCats, budTotal: budTotal, budSpent: budSpent, overList: overList, daysLeft: daysLeft, tobat: tobat,
    mood: mood, line: lines[S.lineIdx % lines.length].replace('{cat}', overList[0] || ''),
    invTotal: invTotal, invModal: invModal, debtLeft: debtLeft, debtActive: debtActive, goalSaved: goalSaved, goalTarget: goalTarget,
    sumT: sumT, inR: inR, y0: y0, m0: m0
  };
}

/* ---------- Komponen kecil ---------- */
function iniBadge(s, size, fs, extra) { return '<div class="badge-ini" style="width:' + size + 'px;height:' + size + 'px;border-radius:' + Math.round(size / 3) + 'px;background:' + s.t + ';color:' + s.d + ';' + (extra || '') + '" aria-hidden="true">' + icon(s.ic || 'tag', Math.round(size * 0.56), 2.2) + '</div>'; }
function txRow(t, sub) {
  var s = catStyle(t.category);
  return '<button class="txbtn press" data-act="detail" data-id="' + esc(t.id) + '">' + iniBadge(s, 42) +
    '<div class="grow"><div class="ellipsis" style="font-size:14px;font-weight:900">' + esc(t.note || t.category) + '</div><div class="sub" style="font-size:12px">' + esc(sub) + '</div></div>' +
    '<div class="' + (t.type === 'in' ? 'pos' : 'neu') + '" style="font-size:14px;font-weight:900;white-space:nowrap">' + (t.type === 'in' ? '+' : '−') + 'Rp ' + thousands(t.amount) + '</div></button>';
}
function dRel(s, T) { return s === T ? 'Hari ini' : s === addDays(T, -1) ? 'Kemarin' : dShort(s); }
function track(cls, w, h) { return '<div class="track"' + (h ? ' style="height:' + h + 'px"' : '') + '><div class="fill ' + cls + '" style="width:' + w + '%"></div></div>'; }
function segs(items, current, act) {
  return '<div class="segwrap" role="tablist">' + items.map(function (it) { return '<button class="seg' + (current === it[0] ? ' on' : '') + '" role="tab" aria-selected="' + (current === it[0]) + '" data-act="' + act + '" data-v="' + it[0] + '">' + it[1] + '</button>'; }).join('') + '</div>';
}
function syncPill() {
  var st = S.sync;
  var cfg = st === 'ok' ? ['#E3F6EC', '#1E7F4F', '#2BB673', 'Tersinkron'] : st === 'error' ? ['#FDE7E7', '#B3261E', '#E5383B', 'Gagal, coba lagi'] : ['#FFF4D6', '#8A5A00', '#FFB703', 'Sinkron…'];
  return '<button data-act="refresh" aria-label="Muat ulang data" style="display:flex;align-items:center;gap:6px;padding:7px 11px;border:2px solid var(--ink);border-radius:999px;background:' + cfg[0] + ';color:' + cfg[1] + ';font-size:12px;font-weight:900;cursor:pointer"><span style="width:8px;height:8px;border-radius:50%;background:' + cfg[2] + ';border:1.5px solid var(--ink)"></span>' + cfg[3] + '</button>';
}

function renderHistResults() {
  var box = document.getElementById('histResults'); if (!box) return;
  var V = compute(), T = V.T, hf = V.txs;
  if (S.fDate !== 'all') { var hr = getRange(S.fDate, T); hf = hf.filter(function (t) { return V.inR(t, hr.from, hr.to); }); }

  if (q) { var qd = q.replace(/\D/g, ''); hf = hf.filter(function (t) { return (t.note || '').toLowerCase().indexOf(q) >= 0 || t.category.toLowerCase().indexOf(q) >= 0 || (qd && String(t.amount).indexOf(qd) >= 0); }); }
  document.getElementById('histSummary').textContent = hf.length + ' transaksi · masuk ' + short(V.sumT(hf, 'in')) + ' · keluar ' + short(V.sumT(hf, 'out'));
  if (!hf.length) {
    box.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 20px">' + cuan('sleepy', 110) + '<div class="h2">Nggak ketemu…</div><div class="sub">Cuan udah nyari sampai kolong kasur. Coba ubah kata kunci atau filternya.</div><button class="btn-soft" data-act="resetFilter" style="margin-top:6px">Reset filter</button></div>';
    return;
  }
  var groups = [], gmap = {};
  hf.forEach(function (t) { if (!gmap[t.date]) { gmap[t.date] = []; groups.push(t.date); } gmap[t.date].push(t); });
  var LIMIT = 60, shown = 0, out = '';
  for (var i = 0; i < groups.length && shown < S.histLimit; i++) {
    var d = groups[i], items = gmap[d], o = V.sumT(items, 'out'), inn = V.sumT(items, 'in');
    var lbl = d === T ? 'Hari ini · ' + dShort(d) : d === addDays(T, -1) ? 'Kemarin · ' + dShort(d) : HARI[dt(d).getUTCDay()] + ', ' + dShort(d) + (d.slice(0, 4) !== T.slice(0, 4) ? ' ' + d.slice(0, 4) : '');
    out += '<div style="display:flex;flex-direction:column;gap:8px"><div class="between" style="font-size:12px;font-weight:900;color:var(--muted);padding:4px 2px 0"><span>' + lbl + '</span><span>' + (o ? 'keluar ' + rp(o) : 'masuk ' + rp(inn)) + '</span></div>' + items.map(function (t) { return txRow(t, t.category); }).join('') + '</div>';
    shown += items.length;
  }
  if (shown < hf.length) out += '<button class="dashed" data-act="moreHist">Tampilkan lebih banyak</button>';
  box.innerHTML = out;
}

    var k = d.k, titles = { 'Setor': 'Setor ke ' + x.name, 'Tarik': 'Tarik dari ' + x.name, 'Update Nilai': 'Update nilai ' + x.name };
    var descs = { 'Setor': 'Nilai sekarang ' + rp(x.nilai) + '. Setoran menambah modal dan nilai.', 'Tarik': 'Nilai sekarang ' + rp(x.nilai) + '.', 'Update Nilai': 'Masukkan nilai terkini dari aplikasi ' + (x.platform || 'investasimu') + '. Modal ' + rp(x.modal) + '.' };
    openQuick({ kind: 'inv', sub: k, id: x.id, title: titles[k], desc: descs[k], amountLabel: k === 'Update Nilai' ? 'Nilai terkini' : 'Nominal', cta: k === 'Update Nilai' ? 'Update nilai' : 'Simpan', fields: k === 'Update Nilai' ? [] : ['date'], also: k === 'Setor' ? 'Setor Investasi' : '' }, { amount: k === 'Update Nilai' ? String(Math.round(x.nilai)) : '', also: false });
  },
  qInvNew: function () { openQuick({ kind: 'invNew', title: 'Tambah investasi / rekening', desc: 'Reksa dana, saham, emas, atau saldo di bank lain.', nameLabel: 'Nama aset', namePh: 'mis. Reksa dana pasar uang', amountLabel: 'Modal awal / saldo sekarang', cta: 'Tambahkan', fields: ['name', 'platform', 'kind', 'date'], kinds: INV_KINDS }, { kind: INV_KINDS[0] }); },
  qDebt: function (d) {
    var x = S.data.debts.filter(function (i) { return i.id === d.v; })[0]; if (!x) return;
    var left = x.total - x.paid;
    if (d.k === 'Bayar' && left <= 0) { toast('Udah lunas kok', 'Hutang ini sudah beres. Santai.', 'proud'); return; }
    openQuick(d.k === 'Bayar'
      ? { kind: 'debt', sub: 'Bayar', id: x.id, title: 'Bayar ' + x.name, desc: 'Sisa hutang ' + rp(left) + '.', amountLabel: 'Jumlah bayar', cta: 'Catat pembayaran', fields: ['date'], also: 'Bayar Hutang' }
      : { kind: 'debt', sub: 'Tambah', id: x.id, title: 'Tambah hutang', desc: x.name + ' · sisa sekarang ' + rp(left) + '. Nominal ditambahkan ke total.', amountLabel: 'Tambahan hutang', cta: 'Tambah ke total', fields: ['date'] },
      { amount: d.k === 'Bayar' ? String(Math.round(left)) : '', also: d.k === 'Bayar' });
  },
  qDebtNew: function () { openQuick({ kind: 'debtNew', title: 'Catat hutang baru', desc: 'Ke siapa atau ke mana, dan berapa totalnya. Cuan nggak bakal ngadu.', nameLabel: 'Nama hutang', namePh: 'mis. Pinjaman ke Kak Rina', amountLabel: 'Total hutang', cta: 'Catat hutang', fields: ['name', 'kind', 'date'], kinds: DEBT_KINDS }, { kind: DEBT_KINDS[0] }); },
  submitQuick: submitQuick
};
function goalQuick(id, k) {
  var g = S.data.goals.filter(function (x) { return x.id === id; })[0]; if (!g) return;
  var per = '';
  if (k === 'Setor' && g.deadline) { var T = todayISO(), ml = Math.max(1, (+g.deadline.slice(0, 4) * 12 + +g.deadline.slice(5, 7)) - (+T.slice(0, 4) * 12 + +T.slice(5, 7))); per = String(Math.ceil(Math.max(0, g.target - g.saved) / ml / 1000) * 1000); }
  openQuick(k === 'Setor'
    ? { kind: 'goal', sub: 'Setor', id: id, title: 'Masukin celengan', desc: g.name + ' · terkumpul ' + rp(g.saved) + ' dari ' + rp(g.target) + '.', amountLabel: 'Jumlah setoran', cta: 'Cemplungin!', fields: ['date'], also: 'Setor Tabungan' }
    : { kind: 'goal', sub: 'Tarik', id: id, title: 'Ambil dari celengan', desc: g.name + ' · terkumpul ' + rp(g.saved) + '.', amountLabel: 'Jumlah diambil', cta: 'Ambil', fields: ['date'] },
    { amount: per !== '0' ? per : '', also: false });
}
function openQuick(cfg, init) {
  cfg.fields = cfg.fields || [];
  S.quick = cfg; S.qError = ''; S.qSaving = false;
  S.q = Object.assign({ amount: '', name: '', platform: '', kind: '', deadline: '', date: todayISO(), also: false }, init || {});
  openSheet('quick');
}
function submitQuick() {
  var Q = S.quick, q = S.q, n = Number(q.amount || 0), name = (q.name || '').trim(), err = '';
  if (Q.fields.indexOf('name') >= 0 && !name) err = 'Namanya belum diisi.';
  else if (!q.amount) err = 'Nominalnya belum diisi.';
  else if (!(n > 0)) err = 'Nominal harus lebih dari 0.';
  if (err) { S.qError = err; renderSheet(false); return; }
  var call, before = JSON.parse(JSON.stringify(S.data));
  if (Q.kind === 'budget') call = server('setBudget', Q.id, n);
  else if (Q.kind === 'goal') call = server('goalTx', { id: Q.id, kind: Q.sub, amount: n, date: q.date, alsoExpense: !!q.also });
  else if (Q.kind === 'goalNew') call = server('addGoal', { name: name, target: n, deadline: q.deadline || '' });
  else if (Q.kind === 'inv') call = server('invTx', { id: Q.id, kind: Q.sub, amount: n, date: q.date || todayISO(), alsoExpense: !!q.also });
  else if (Q.kind === 'invNew') call = server('addInv', { name: name, platform: q.platform || '', kind: q.kind || 'Lainnya', modal: n, date: q.date || todayISO() });
  else if (Q.kind === 'debt') call = server('debtTx', { id: Q.id, kind: Q.sub, amount: n, date: q.date, alsoExpense: !!q.also });
  else if (Q.kind === 'debtNew') call = server('addDebt', { name: name, kind: q.kind || 'Pribadi', total: n, date: q.date || todayISO() });
  S.qSaving = true; S.sync = 'loading'; renderSheet(false);
  call.then(function (d) {
    setData(d); S.qSaving = false; S.sheet = null; S.quick = null; renderAll();
    var msg = feedback(Q, n, name, before, d);
    toast(msg[0], msg[1], msg[2]);
    if (msg[3]) party();
  }).catch(function (e) { S.qSaving = false; S.sync = 'error'; S.qError = errMsg(e); renderSheet(false); renderMain(false); });
}
function feedback(Q, n, name, before, after) {
  var find = function (list, id) { return list.filter(function (x) { return x.id === id; })[0]; };
  if (Q.kind === 'budget') return ['Budget ' + Q.id + ' jadi ' + rp(n), 'Cuan bakal jagain batasnya.', 'proud'];
  if (Q.kind === 'goalNew') return ['Impian “' + name + '” dibuat', 'Cuan sudah siapin celengannya.', 'happy'];
  if (Q.kind === 'goal') {
    var g0 = find(before.goals, Q.id), g1 = find(after.goals, Q.id) || g0;
    if (Q.sub === 'Setor' && g0.saved < g0.target && g1.saved >= g1.target) return ['TARGET “' + g1.name + '” TERCAPAI!', 'Cuan pingsan saking bahagianya.', 'proud', true];
    return Q.sub === 'Setor' ? [rp(n) + ' masuk celengan', '“' + g1.name + '” makin dekat. Gas terus!', 'proud'] : ['Ambil ' + rp(n) + ' dari celengan', 'Semoga buat hal penting ya.', 'shock'];
  }
  if (Q.kind === 'inv') {
    var x = find(after.invs, Q.id) || find(before.invs, Q.id);
    if (Q.sub === 'Setor') return ['Setor ' + rp(n) + ' ke ' + x.name, 'Duitnya disuruh kerja. Mantap.', 'proud'];
    if (Q.sub === 'Tarik') return ['Tarik ' + rp(n) + ' dari ' + x.name, 'Semoga buat hal penting ya.', 'happy'];
    return x.nilai >= x.modal ? ['Nilai ' + x.name + ' diperbarui', 'Lagi cuan! Cuan senyum lebar.', 'proud'] : ['Nilai ' + x.name + ' diperbarui', 'Lagi boncos… sabar, ini jangka panjang.', 'cry'];
  }
  if (Q.kind === 'invNew') return ['“' + name + '” ditambahkan', 'Aset baru, Cuan senang.', 'happy'];
  if (Q.kind === 'debt') {
    var d1 = find(after.debts, Q.id), left = d1 ? d1.total - d1.paid : 0;
    if (Q.sub === 'Bayar' && left <= 0) return ['LUNAS! ' + d1.name + ' beres', 'Bebas hutang, Cuan lempar konfeti.', 'proud', true];
    return Q.sub === 'Bayar' ? ['Pembayaran tercatat', 'Sisa ' + rp(left) + '. Dikit lagi!', 'proud'] : ['Hutang nambah ' + rp(n), 'Sisa sekarang ' + rp(left) + '. Cuan deg-degan.', 'panic'];
  }
  if (Q.kind === 'debtNew') return ['Hutang “' + name + '” dicatat', 'Yang penting jujur. Ayo dicicil.', 'panic'];
  return ['Tersimpan', '', 'happy'];
}

/* ---------- Input ---------- */
function moneyInput(el, setter) {
  var v = digits(el.value); setter(v);
  el.value = fmtDigits(v);
  try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { }
}
var IN = {
  amount: function (el) { moneyInput(el, function (v) { S.form.amount = v; }); },
  note: function (el) { S.form.note = el.value; },
  search: function (el) { S.search = el.value; S.histLimit = 60; renderHistResults(); },
  qAmount: function (el) { moneyInput(el, function (v) { S.q.amount = v; }); },
  qName: function (el) { S.q.name = el.value; },
  qPlatform: function (el) { S.q.platform = el.value; }
};
var CH = {
  cFrom: function (el) { S.cFrom = el.value; renderMain(false); },
  cTo: function (el) { S.cTo = el.value; renderMain(false); },
  fDate: function (el) { S.fDate = el.value; S.histLimit = 60; renderHistResults(); },
  formDate: function (el) { S.form.date = el.value; renderSheet(false); },
  qKind: function (el) { S.q.kind = el.value; },
  qDeadline: function (el) { S.q.deadline = el.value; },
  qDate: function (el) { S.q.date = el.value; },
  qAlso: function (el) { S.q.also = el.checked; }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('input', function (e) { var el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
document.addEventListener('change', function (e) { var el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el, e); });
document.addEventListener('keydown', function (e) {
  if (!S.token && /^[0-9]$/.test(e.key)) { pinKey(e.key); return; }
  if (!S.token && e.key === 'Backspace') { pinKey('del'); return; }
  if (!S.token && e.key === 'Enter') { pinKey('ok'); return; }
  if (e.key === 'Escape') { if (S.confirm) ACT.cancelDelete(); else if (S.sheet) closeSheet(); }
  if (S.sheet === 'add' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
    var map = { 'Backspace': 'del', 'Delete': 'clr', 'Escape': null, '=': '=', 'Enter': '=', '+': '+', '-': '-' };
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); calcKey(e.key); return; }
    if (map[e.key]) { e.preventDefault(); if (e.key === 'Enter' && !calcHasOp(S.form.expr)) ACT.save(); else calcKey(map[e.key]); return; }
  }
  if (e.key === 'Enter' && S.sheet && e.target.tagName === 'INPUT') { e.preventDefault(); if (S.sheet === 'add') ACT.save(); else if (S.sheet === 'quick') submitQuick(); }
});
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.token && S.data && Date.now() - S.lastSync > 60000 && !S.saving && !S.qSaving) load(true); });

/* ---------- Mulai ---------- */
S.histLimit = 60;
(function start() {
  if (S.token) { try { var c = store(CACHE_KEY); if (c) S.data = JSON.parse(c); } catch (e) { S.data = null; } }
  renderAll();
  if (S.token) load(!!S.data); else checkPin();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { });
})();
</script>
</body>
